<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#11152b">
<title>WERBUNG-SPAM</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,Arial,sans-serif;background:#11152b;color:#fff;overflow:hidden}button{font:inherit;cursor:pointer;border:0;font-weight:900}.screen{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#344477,#11152b 65%);padding:20px}.intro{text-align:center;max-width:540px}.logo{font-size:clamp(46px,12vw,90px);line-height:.95;font-weight:1000;letter-spacing:-5px;text-shadow:5px 6px 0 #ff4b8b,10px 11px 0 #624bff;transform:rotate(-3deg);margin-bottom:30px}.intro p{color:#d7dcff;font-size:17px;line-height:1.5}.start{margin-top:20px;padding:18px 44px;border-radius:18px;background:linear-gradient(120deg,#ffe45c,#ff8c42);color:#281b36;font-size:25px;box-shadow:0 7px 0 #b34e36;transition:transform .12s}.start:active{transform:translateY(5px);box-shadow:0 2px 0 #b34e36}.tiny{font-size:12px!important;color:#aeb8df!important;margin-top:25px}.game{position:fixed;inset:0;background:linear-gradient(135deg,#171d3d,#3b245a);overflow:hidden}.bar{position:absolute;z-index:10000;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}.counter,.stop{background:#080d20eF;border:1px solid #ffffff35;border-radius:13px;padding:10px 14px;font-weight:900;box-shadow:0 5px 18px #0005}.stop{pointer-events:auto;color:#fff;background:#e94367}.counter b{color:#ffe45c}.ad{position:absolute;width:min(300px,78vw);min-height:145px;background:#fff;color:#17172a;border:4px solid #ffe45c;border-radius:15px;box-shadow:0 12px 35px #0009;padding:14px;animation:pop .16s ease-out;z-index:2;overflow:hidden}.ad .tag{font-size:10px;letter-spacing:1px;color:#73738c;font-weight:1000}.ad h2{font-size:22px;line-height:1.05;margin:8px 0}.ad p{font-size:13px;margin:5px 0 12px;color:#45455b}.ad .deal{display:inline-block;background:#ffdf4e;padding:7px 10px;border-radius:8px;font-weight:1000;font-size:13px}.ad .close{position:absolute;right:7px;top:5px;background:#eee;color:#333;border-radius:50%;width:25px;height:25px;font-size:16px}.ad .fake{position:absolute;right:9px;bottom:8px;font-size:9px;color:#9a9aab}.ad:nth-child(3n){border-color:#7cf0d0;transform:rotate(2deg)}.ad:nth-child(4n){border-color:#ff82bd;transform:rotate(-2deg)}@keyframes pop{from{transform:scale(.65) rotate(-5deg);opacity:0}to{opacity:1}}.end{position:absolute;z-index:11000;inset:0;display:grid;place-items:center;background:#080b1dcc;padding:20px}.endbox{background:#20294c;border:2px solid #ffffff35;border-radius:22px;padding:26px;text-align:center;width:min(390px,100%);box-shadow:0 20px 70px #0009}.endbox h1{font-size:34px;margin:0}.endbox p{color:#d1d8f7;line-height:1.5}.again{padding:13px 22px;border-radius:12px;background:#ffe45c;color:#29203c}.hidden{display:none!important}@media(max-width:420px){.logo{letter-spacing:-3px}.bar{top:7px;left:7px;right:7px}.counter,.stop{padding:8px 10px;font-size:13px}.ad{width:min(260px,75vw);min-height:130px;padding:11px}.ad h2{font-size:19px}}
</style>
</head>
<body>
<div class="screen" id="intro"><div class="intro"><div class="logo">WERBUNG<br>SPAM!</div><p>Das vermutlich nervigste Spiel im Internet.<br>Du klickst auf START. Der Rest ist… Werbung. Überall Werbung.</p><button class="start" id="start">▶ START</button><p class="tiny">Nur erfundene Pop-ups im Spiel. Keine echten Anzeigen, keine Weiterleitungen.</p></div></div>
<div class="game hidden" id="game"><div class="bar"><div class="counter">📢 Werbungen: <b id="count">0</b></div><button class="stop" id="stop">✖ SPAM STOPPEN</button></div></div>
<div class="end hidden" id="end"><div class="endbox"><h1>🛑 ENDLICH RUHE!</h1><p id="result">Du hast es geschafft.</p><button class="again" id="again">NOCHMAL STARTEN</button></div></div>
<script>
const $=id=>document.getElementById(id);
const game=$('game');
const ads=[
['MEGA MILCH DEAL!','Kaufe 1 Milch und bekomme… noch mehr Milch!','JETZT MILCHEN 🥛'],
['DU BIST UNSER 1.000.000. BESUCHER!','Dein Preis wartet. Er ist wahrscheinlich ein Keks.','KEKS ANSEHEN 🍪'],
['SUPER GAMING BOOST','Dein Toaster kann jetzt 300 FPS!','BOOSTEN ⚡'],
['KLICK HIER!!!','Warum? Gute Frage. KLICK TROTZDEM!','ICH KLICKE 😎'],
['GRATIS LUFT IM ANGEBOT','Atme jetzt. Nur heute kostenlos!','LUFT HOLEN 🌬️'],
['DIESE BANANE IST LEGENDÄR','Sie kostet nur 999.999 Fantasie-Münzen.','BANANE KAUFEN 🍌'],
['ACHTUNG! WICHTIGE WERBUNG','Diese Werbung unterbricht deine Werbung.','WEITERLESEN 📣'],
['GEWINNE EINEN UNSICHTBAREN HAMSTER','Er ist so selten, dass man ihn nicht sieht.','HAMSTER HOLEN 🐹'],
['100% MEHR WERBUNG','Wissenschaftler sind verwirrt. Du nicht.','MEHR WERBUNG ➕']
];
let total=0,timer=null,spawnRate=430,audio=null;
function sound(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=250+Math.random()*700;g.gain.value=.035;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.055)}catch(e){}}
function makeAd(){if(!game.classList.contains('hidden')){const data=ads[Math.floor(Math.random()*ads.length)];const el=document.createElement('div');el.className='ad';el.innerHTML='<div class="tag">★ SPONSORED • SUPER WICHTIG ★</div><button class="close" aria-label="Werbung schließen">×</button><h2></h2><p></p><span class="deal"></span><span class="fake">100% erfunden</span>';el.querySelector('h2').textContent=data[0];el.querySelector('p').textContent=data[1];el.querySelector('.deal').textContent=data[2];const maxX=Math.max(8,innerWidth-Math.min(300,innerWidth*.78)-8),maxY=Math.max(75,innerHeight-175);el.style.left=(8+Math.random()*maxX)+'px';el.style.top=(65+Math.random()*Math.max(10,maxY-65))+'px';el.style.zIndex=String(2+total);el.querySelector('.close').onclick=()=>{el.remove();sound()};game.appendChild(el);total++;$('count').textContent=total;sound();while(game.querySelectorAll('.ad').length>38){game.querySelector('.ad')?.remove()}}}
function start(){clearInterval(timer);document.querySelectorAll('.ad').forEach(x=>x.remove());total=0;$('count').textContent='0';$('intro').classList.add('hidden');$('end').classList.add('hidden');game.classList.remove('hidden');spawnRate=430;makeAd();timer=setInterval(()=>{makeAd();if(spawnRate>100){spawnRate-=5;clearInterval(timer);timer=setInterval(makeAd,spawnRate)}},spawnRate)}
function stop(){clearInterval(timer);timer=null;game.classList.add('hidden');$('end').classList.remove('hidden');$('result').textContent='Du hast '+total+' Werbungen überlebt. Dein Posteingang braucht jetzt Urlaub.'}
$('start').onclick=start;$('stop').onclick=stop;$('again').onclick=start;
</script>
</body>
</html>
