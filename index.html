<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#11152b"><title>WERBUNG-SPAM</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,Arial,sans-serif;background:#11152b;color:#fff;overflow:hidden}button{font:inherit;cursor:pointer;border:0;font-weight:900}.screen{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#344477,#11152b 65%);padding:20px}.intro{text-align:center;max-width:550px}.logo{font-size:clamp(46px,12vw,90px);line-height:.95;font-weight:1000;letter-spacing:-5px;text-shadow:5px 6px 0 #ff4b8b,10px 11px 0 #624bff;transform:rotate(-3deg);margin-bottom:30px}.intro p{color:#d7dcff;font-size:17px;line-height:1.5}.start{margin-top:20px;padding:18px 44px;border-radius:18px;background:linear-gradient(120deg,#ffe45c,#ff8c42);color:#281b36;font-size:25px;box-shadow:0 7px 0 #b34e36}.start:active{transform:translateY(4px)}.tiny{font-size:12px!important;color:#aeb8df!important;margin-top:25px}.game{position:fixed;inset:0;background:linear-gradient(135deg,#171d3d,#3b245a);overflow:hidden}.bar{position:absolute;z-index:10000;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}.counter,.stop,.mute{background:#080d20ef;border:1px solid #ffffff35;border-radius:13px;padding:10px 14px;font-weight:900;box-shadow:0 5px 18px #0005}.stop{pointer-events:auto;color:#fff;background:#e94367}.mute{pointer-events:auto;color:#fff;background:#4c5b91}.counter b{color:#ffe45c}.ad{position:absolute;width:min(310px,80vw);min-height:168px;background:#fff;color:#17172a;border:4px solid #ffe45c;border-radius:15px;box-shadow:0 12px 35px #0009;padding:14px;animation:pop .18s cubic-bezier(.2,.8,.2,1);z-index:2;overflow:hidden}.ad .tag{font-size:10px;letter-spacing:1px;color:#73738c;font-weight:1000}.ad h2{font-size:21px;line-height:1.05;margin:8px 28px 7px 0}.ad p{font-size:13px;margin:5px 0 11px;color:#45455b}.ad .visit{display:inline-block;background:#5945d8;color:#fff;padding:8px 10px;border-radius:8px;font-weight:1000;font-size:12px;text-decoration:none}.ad .visit:focus,.close:focus{outline:3px solid #ff9e32;outline-offset:2px}.ad .close{position:absolute;right:7px;top:5px;background:#eee;color:#333;border-radius:50%;width:25px;height:25px;font-size:16px}.ad .fake{position:absolute;right:9px;bottom:8px;font-size:9px;color:#9a9aab}.ad:nth-child(3n){border-color:#7cf0d0}.ad:nth-child(4n){border-color:#ff82bd}@keyframes pop{from{transform:scale(.55) rotate(-6deg);opacity:0}to{opacity:1}}.end{position:absolute;z-index:11000;inset:0;display:grid;place-items:center;background:#080b1dcc;padding:20px}.endbox{background:#20294c;border:2px solid #ffffff35;border-radius:22px;padding:26px;text-align:center;width:min(390px,100%);box-shadow:0 20px 70px #0009}.endbox h1{font-size:34px;margin:0}.endbox p{color:#d1d8f7;line-height:1.5}.again{padding:13px 22px;border-radius:12px;background:#ffe45c;color:#29203c}.hidden{display:none!important}@media(max-width:420px){.logo{letter-spacing:-3px}.bar{top:7px;left:7px;right:7px}.counter,.stop,.mute{padding:8px 10px;font-size:12px}.ad{width:min(270px,78vw);min-height:155px;padding:11px}.ad h2{font-size:19px}}
</style></head>
<body>
<div class="screen" id="intro"><div class="intro"><div class="logo">WERBUNG<br>SPAM!</div><p>Das vermutlich nervigste Lernspiel im Internet.<br>Du klickst auf START. Dann stürmen die Werbekarten herein!</p><button class="start" id="start">▶ START</button><p class="tiny">Anklickbare, ausgewählte Lernseiten. Keine Werbenetzwerke und keine versteckten Weiterleitungen.</p></div></div>
<div class="game hidden" id="game"><div class="bar"><div class="counter">📢 Werbekarten: <b id="count">0</b></div><button class="mute" id="mute">🔊 TON AN</button><button class="stop" id="stop">✖ SPAM STOPPEN</button></div></div>
<div class="end hidden" id="end"><div class="endbox"><h1>🛑 ENDLICH RUHE!</h1><p id="result">Du hast es geschafft.</p><button class="again" id="again">NOCHMAL STARTEN</button></div></div>
<script>
const $=id=>document.getElementById(id),game=$('game');
const destinations=[
{title:'Khan Academy',desc:'Mathe, Naturwissenschaften und viele weitere Themen verständlich lernen.',label:'LERNEN AUF KHAN ACADEMY ↗',url:'https://de.khanacademy.org/'},
{title:'Planet Wissen',desc:'Spannende Erklärungen zu Natur, Geschichte, Technik und Alltag.',label:'WISSEN ENTDECKEN ↗',url:'https://www.planet-wissen.de/'},
{title:'logo! – Kindernachrichten',desc:'Nachrichten und Hintergründe verständlich erklärt.',label:'BEITRÄGE LESEN ↗',url:'https://www.zdf.de/kinder/logo'},
{title:'Wikimedia – Wikipedia',desc:'Lies Hintergrundartikel und entdecke neue Themen.',label:'ARTIKEL LESEN ↗',url:'https://de.wikipedia.org/'},
{title:'LEIFIphysik',desc:'Physik mit Erklärungen, Beispielen und Übungen entdecken.',label:'PHYSIK ENTDECKEN ↗',url:'https://www.leifiphysik.de/'},
{title:'ARD alpha Lernen',desc:'Lernvideos und Wissen zu verschiedenen Schulfächern.',label:'LERNVIDEOS ANSEHEN ↗',url:'https://www.ardalpha.de/lernen/'},
{title:'National Geographic',desc:'Entdecke Tiere, Natur, Umwelt und unseren Planeten.',label:'NATUR ENTDECKEN ↗',url:'https://www.nationalgeographic.de/'}
];
const silly=[
['MEGA MILCH DEAL!','Kaufe 1 Milch und bekomme… noch mehr Milch!','MILCH-ALARM 🥛'],
['DEIN TOASTER IST ZU LANGSAM','Er träumt von 300 FPS.','TOASTER UPGRADEN ⚡'],
['GRATIS LUFT IM ANGEBOT','Atme jetzt. Nur heute kostenlos!','LUFT HOLEN 🌬️'],
['DIESE BANANE IST LEGENDÄR','Sie kostet 999.999 Fantasie-Münzen.','BANANE ANSEHEN 🍌'],
['WERBUNG IN DEINER WERBUNG','Eine Anzeige hat eine weitere Anzeige bestellt.','WAS PASSIERT HIER?! 📣']
];
let total=0,timer=null,audio=null,muted=false,voices=[],soundStep=0;
function tone(freq,duration,wave='sine',volume=.045,delay=0){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain(),now=audio.currentTime+delay;o.type=wave;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(volume,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+duration);o.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+duration+.02)}catch(e){}}
function popSound(){soundStep++;const base=330+(soundStep%5)*65;tone(base,.09,'triangle',.035);tone(base*1.5,.12,'sine',.018,.045)}
function clickSound(){tone(620,.055,'square',.025);tone(880,.08,'sine',.02,.045)}
function closeSound(){tone(740,.07,'triangle',.03);tone(520,.11,'sine',.025,.055)}
function makeAd(){if(game.classList.contains('hidden'))return;const educational=Math.random()<.78;let title,desc,label,url;if(educational){const d=destinations[Math.floor(Math.random()*destinations.length)];({title,desc,url}=d);label=d.label}else{const d=silly[Math.floor(Math.random()*silly.length)];[title,desc,label]=d;url='https://de.wikipedia.org/'}const el=document.createElement('div');el.className='ad';const tag=document.createElement('div');tag.className='tag';tag.textContent=educational?'★ LERN-TIPP • EXTERNE SEITE':'★ NERVIGE SPASS-ANZEIGE';const close=document.createElement('button');close.className='close';close.type='button';close.textContent='×';close.setAttribute('aria-label','Karte schließen');const h=document.createElement('h2');h.textContent=title;const p=document.createElement('p');p.textContent=desc;const a=document.createElement('a');a.className='visit';a.textContent=label;a.href=url;a.target='_blank';a.rel='noopener noreferrer';const note=document.createElement('span');note.className='fake';note.textContent='öffnet neue Registerkarte';close.onclick=e=>{e.stopPropagation();el.remove();closeSound()};a.onclick=clickSound;el.append(tag,close,h,p,a,note);const w=Math.min(310,innerWidth*.8),maxX=Math.max(8,innerWidth-w-8),maxY=Math.max(80,innerHeight-190);el.style.left=(8+Math.random()*maxX)+'px';el.style.top=(68+Math.random()*Math.max(10,maxY-68))+'px';el.style.zIndex=String(2+total);game.appendChild(el);total++;$('count').textContent=total;popSound();while(game.querySelectorAll('.ad').length>34)game.querySelector('.ad')?.remove()}
function start(){clearInterval(timer);game.querySelectorAll('.ad').forEach(x=>x.remove());total=0;$('count').textContent='0';$('intro').classList.add('hidden');$('end').classList.add('hidden');game.classList.remove('hidden');if(!muted){tone(440,.12,'sine',.04);tone(660,.14,'sine',.035,.12)}makeAd();let delay=650;timer=setInterval(()=>{makeAd();delay=Math.max(190,delay-16);clearInterval(timer);timer=setInterval(makeAd,delay)},delay)}
function stop(){clearInterval(timer);timer=null;game.classList.add('hidden');$('end').classList.remove('hidden');$('result').textContent='Du hast '+total+' Werbekarten überlebt. Hoffentlich hast du nebenbei etwas gelernt!';if(!muted){tone(660,.13,'sine',.04);tone(520,.16,'sine',.04,.14);tone(390,.22,'triangle',.04,.3)}}
$('start').onclick=start;$('stop').onclick=stop;$('again').onclick=start;
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇 TON AUS':'🔊 TON AN';if(!muted)clickSound()};
</script></body></html>
